name: Nginx Config CI/CD

# Коли запускати пайплайн: при кожному push або pull request у гілку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ЕТАП 1: Перевірка синтаксису конфігу (CI)
  validate-nginx:
    runs-on: ubuntu-latest # GitHub дає чисту віртуалку Ubuntu

    steps:
      # Крок 1: Завантажити код із репозиторію на раннер
      - name: Checkout repository
        uses: actions/checkout@v5

      # Крок 2: Запустити офіційний контейнер Nginx і перевірити наш default.conf через nginx -t
      - name: Test Nginx configuration syntax
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/default.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine nginx -t

  # ЕТАП 2: Імітація деплою на сервер (CD)
  deploy-to-server:
    needs: validate-nginx # Запуститься ТІЛЬКИ якщо успішно пройшов етап validate-nginx
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Деплоїмо тільки з main, не з Pull Request

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate Deploy via SSH
        env:
          # Так безпечно передаються секрети (паролі, SSH-ключі) з налаштувань репозиторію
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Connecting to production server..."
          echo "Copying default.conf and reloading Nginx (systemctl reload nginx)..."
          echo "Deploy finished successfully!"
