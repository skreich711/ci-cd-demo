name: Fast VPS CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test Nginx syntax
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/default.conf:/etc/nginx/conf.d/ci-cd-app.conf:ro \
            nginx:alpine nginx -t

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          rsync -avz -e "ssh -p 7113 -o StrictHostKeyChecking=no" default.conf ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/etc/nginx/conf.d/ci-cd-app.conf
          ssh -p 7113 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "nginx -t && systemctl restart nginx"
